# configs/config_ava_cmf.yaml
project:
  base_path: .

# Test settings for AVA-Speech CMF evaluation
test_settings:
  max_files: 0
  thresholds: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

# Models configuration (enable desired models)
models:
  silero:
    wrapper: src.wrappers.vad_silero
    vad_type: probabilistic  
    enabled: true
    
  webrtc:
    wrapper: src.wrappers.vad_webrtc
    enabled: true
    
  whisper_tiny:
    wrapper: src.wrappers.vad_whisper_tiny
    enabled: true
    
  whisper_small:
    wrapper: src.wrappers.vad_whisper_small
    enabled: false
    
  panns:
    wrapper: src.wrappers.vad_panns
    vad_type: probabilistic  
    enabled: false

  epanns:
    wrapper: src.wrappers.vad_epanns
    vad_type: probabilistic  
    enabled: true

  ast:
    wrapper: src.wrappers.vad_ast
    vad_type: probabilistic
    chunk_size: 1024
    enabled: true
    
  passt:
    wrapper: src.wrappers.vad_passt
    vad_type: probabilistic
    enabled: true

  qwen2_audio:
    wrapper: src.wrappers.vad_qwen_optimized
    vad_type: binary
    enabled: false
    requirement: transformers==4.45.0 

  pengi:
    wrapper: src.wrappers.vad_pengi
    vad_type: probabilistic
    enabled: false
    requirement: transformers==4.30.0 

# AVA-Speech CMF scenario definition
scenarios:
  ava_cmf:
    description: "AVA-Speech: CMF = speech only (no music)"
    chunks_path: datasets/ava/chunks_ALL
    ground_truth: ground_truth/ava/cmf.csv